[project]
name = "dramabox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate>=0.25.0",
  "av>=12.0.0",
  "bitsandbytes>=0.45.0",
  "einops>=0.7.0",
  "gradio==5.7.1",
  "hf-xet>=1.5.0",
  "huggingface-hub>=0.20.0,<1.0",
  "peft>=0.7.0",
  "pydantic==2.10.6",
  "pyyaml>=6.0",
  "resemble-perth",
  "safetensors>=0.4.0",
  "sentencepiece>=0.1.99",
  "soundfile>=0.12.0",
  "spaces>=0.30.0",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "transformers>=4.45.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
  { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
resemble-perth = { git = "https://github.com/resemble-ai/Perth.git", rev = "master" }

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ipython>=9.13.0",
    "nbwipers>=0.6.2",
]
